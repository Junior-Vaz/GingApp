name: Build & Push Docker Images

# Publica as imagens no GHCR a cada push na master (ou disparo manual) — SEM esperar testes.
# Os testes (lint, unitarios, e2e, build dos frontends) ficam em .github/workflows/tests.yml e rodam
# em pull request ou manualmente (decisao do dono: o pipeline de deploy estava lento demais).
# Mesmo assim o build NAO e cego: o Dockerfile de cada projeto roda `npm run build` (tsc + nest build /
# vite build), entao erro de tipo ou de compilacao reprova a imagem.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Um push novo cancela o build anterior ainda em andamento da mesma branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Imagens base vem do espelho publico da AWS (espelha as imagens oficiais do Docker Hub, mesmas
  # tags, sem exigir login). O Docker Hub limita pulls ANONIMOS por IP e os runners do GitHub
  # compartilham IPs: o job "Start postgres service container" ja falhou com "toomanyrequests".
  NODE_IMAGE: public.ecr.aws/docker/library/node:22-alpine
  NGINX_IMAGE: public.ecr.aws/docker/library/nginx:1.27-alpine

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # target: runner — o Dockerfile tem um stage "migrate" depois do "runner"; sem target
          # o Docker builda o ultimo stage (a imagem pesada de migration) como se fosse o backend.
          - name: Backend
            image: gingapp-backend
            context: ./backend
            target: runner
          # Imagem auxiliar de migration (prisma migrate deploy + bootstrap)
          - name: Migrate
            image: gingapp-migrate
            context: ./backend
            target: migrate
          - name: Painel
            image: gingapp-painel
            context: ./painel.gingapp.com.br
            target: ""
          - name: App
            image: gingapp-app
            context: ./app.gingapp.com.br
            target: ""
          - name: Admin
            image: gingapp-admin
            context: ./admin.gingapp.com.br
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # O contexto `secrets` nao existe dentro de `strategy.matrix`, so em steps: por isso os
      # build-args dos frontends (embutidos no bundle em tempo de build) sao montados aqui.
      - name: Compose build args
        id: vite
        env:
          API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api' }}
          APP_URL: ${{ secrets.VITE_APP_URL || 'http://localhost:8082' }}
          IMAGE: ${{ matrix.image }}
          # Opcional: se existir, as imagens tambem sao publicadas no Docker Hub (servidores que nao
          # alcancam o ghcr.io, mas alcancam o Docker Hub). Sem o secret, so o GHCR (como antes).
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$REGISTRY/$OWNER/$IMAGE:latest"
            echo "$REGISTRY/$OWNER/$IMAGE:$GITHUB_SHA"
            if [ -n "$DH_USER" ]; then
              echo "docker.io/${DH_USER,,}/$IMAGE:latest"
              echo "docker.io/${DH_USER,,}/$IMAGE:$GITHUB_SHA"
            fi
            echo 'EOF'
            if [ -n "$DH_USER" ]; then echo 'dockerhub=true'; else echo 'dockerhub=false'; fi
          } >> "$GITHUB_OUTPUT"
          {
            echo 'args<<EOF'
            echo "NODE_IMAGE=$NODE_IMAGE"
            case "$IMAGE" in
              gingapp-painel)
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "VITE_API_URL=$API_URL"
                echo "VITE_APP_URL=$APP_URL"
                ;;
              gingapp-app|gingapp-admin)
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "VITE_API_URL=$API_URL"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # SEM docker/setup-buildx-action: ele baixa a imagem moby/buildkit de um registro anonimo e
      # falhou duas vezes (Docker Hub: timeout/limite; espelho da AWS: "Rate exceeded"), porque os
      # runners do GitHub compartilham IP. O builder padrao ja vem no runner e nao precisa de pull.
      # As imagens base (node/nginx) sao baixadas aqui, com NOVAS TENTATIVAS e espera crescente; o
      # build seguinte usa a copia local e nem consulta o registro (testado com um registro
      # inalcancavel). Trade-off: sem cache de camadas (cache gha exige o builder docker-container).
      - name: Pre-pull base images (com retry)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          pull() {
            for i in 1 2 3 4 5 6; do
              if docker pull "$1"; then return 0; fi
              echo "pull de $1 falhou (tentativa $i/6); aguardando $((i * 15))s"
              sleep $((i * 15))
            done
            return 1
          }
          pull "$NODE_IMAGE"
          case "$IMAGE" in
            gingapp-painel|gingapp-app|gingapp-admin) pull "$NGINX_IMAGE" ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (opcional)
        if: steps.vite.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          build-args: ${{ steps.vite.outputs.args }}
          tags: ${{ steps.vite.outputs.tags }}
