name: Build & Push Docker Images

# Mesmo desenho do GestorPrinte: valida cada projeto (build/type-check) e, so depois, builda e
# publica as imagens no GHCR. Roda em push na master (branch de producao) ou disparo manual.
# Em pull request roda so a validacao (nao publica imagem).
# Diferenca para o GestorPrinte: a validacao tambem roda lint e testes (unitarios + e2e do backend
# com Postgres de servico), porque aqui a suite existe e e o que impede um falso-verde.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    # Postgres so para a suite e2e (o test:e2e roda migrate deploy + seed no banco apontado).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gingapp
          POSTGRES_PASSWORD: gingapp
          POSTGRES_DB: gingapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gingapp -d gingapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gingapp:gingapp@localhost:5432/gingapp_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Prisma client e necessario pro TS compilar — gera antes do build
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build (NestJS — inclui type-check)
        working-directory: backend
        run: npm run build

      - name: Unit tests
        working-directory: backend
        run: npm run test:unit

      # migrate deploy + seed + todas as suites e2e (banco isolado do servico acima)
      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e

  validate-frontends:
    name: Validate ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # build: app/painel fazem tsc + vite build; admin faz vue-tsc -b + vite build
          - project: app.gingapp.com.br
            lint: true
          - project: painel.gingapp.com.br
            lint: true
          - project: admin.gingapp.com.br
            lint: false # o admin nao tem eslint configurado
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Lint
        if: matrix.lint
        working-directory: ${{ matrix.project }}
        run: npm run lint

      - name: Tests
        working-directory: ${{ matrix.project }}
        run: npm test

      - name: Build (type-check + vite)
        working-directory: ${{ matrix.project }}
        run: npm run build

  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontends]
    # So publica a partir de push/dispatch (nunca em pull request)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # target: runner — o Dockerfile tem um stage "migrate" depois do "runner"; sem target
          # o Docker builda o ultimo stage (a imagem pesada de migration) como se fosse o backend.
          - name: Backend
            image: gingapp-backend
            context: ./backend
            target: runner
          # Imagem auxiliar de migration (prisma migrate deploy): docker compose run --rm migrate
          - name: Migrate
            image: gingapp-migrate
            context: ./backend
            target: migrate
          - name: Painel
            image: gingapp-painel
            context: ./painel.gingapp.com.br
            target: ""
          - name: App
            image: gingapp-app
            context: ./app.gingapp.com.br
            target: ""
          - name: Admin
            image: gingapp-admin
            context: ./admin.gingapp.com.br
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # O contexto `secrets` nao existe dentro de `strategy.matrix`, so em steps: por isso os
      # build-args dos frontends (embutidos no bundle em tempo de build) sao montados aqui.
      - name: Compose build args
        id: vite
        env:
          API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api' }}
          APP_URL: ${{ secrets.VITE_APP_URL || 'http://localhost:8082' }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo 'args<<EOF'
            case "$IMAGE" in
              gingapp-painel)
                echo "VITE_API_URL=$API_URL"
                echo "VITE_APP_URL=$APP_URL"
                ;;
              gingapp-app|gingapp-admin)
                echo "VITE_API_URL=$API_URL"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          build-args: ${{ steps.vite.outputs.args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
