name: Build & Push Docker Images

# Push na master -> GitHub Actions builda e publica no Docker Hub
# (DOCKERHUB_USERNAME/gingapp-*:latest e :<sha>). O Easypanel baixa o :latest.
# GHCR nao e usado: o servidor do Easypanel nao alcanca github.com/ghcr.io (timeout),
# mas alcanca registry-1.docker.io. Secrets: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Um push novo cancela o build anterior da mesma branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # target: server - backend que aplica as migrations, cria o super admin e inicia a API
          # (um unico container, como no GestorPrint; nao ha imagem "migrate" separada).
          - name: Backend
            image: gingapp-backend
            context: ./backend
            target: server
            frontend: "false"
          - name: Painel
            image: gingapp-painel
            context: ./painel.gingapp.com.br
            target: ""
            frontend: "true"
          - name: App
            image: gingapp-app
            context: ./app.gingapp.com.br
            target: ""
            frontend: "true"
          - name: Admin
            image: gingapp-admin
            context: ./admin.gingapp.com.br
            target: ""
            frontend: "true"
    steps:
      - uses: actions/checkout@v4

      # Imagens base (node/nginx). Registros anonimos limitam pulls por IP e os runners do GitHub
      # compartilham IP: o Docker Hub deu "toomanyrequests" e o espelho da AWS deu "Rate exceeded"
      # (inclusive ao baixar o builder do docker/setup-buildx-action, por isso ele NAO e usado: o
      # builder padrao do runner nao precisa de pull). Aqui tenta o espelho da AWS e, se falhar, o
      # Docker Hub, em rodadas com espera crescente; o build usa a copia local e o registro nem e
      # consultado (testado com um registro inalcancavel).
      - name: Pull base images (retry + fallback)
        id: base
        env:
          FRONTEND: ${{ matrix.frontend }}
        run: |
          pull_any() {
            for attempt in 1 2 3 4; do
              for img in "$@"; do
                if docker pull "$img" > /dev/null 2>&1; then echo "$img"; return 0; fi
              done
              echo "rodada $attempt/4 falhou para: $*; aguardando $((attempt * 20))s" >&2
              sleep $((attempt * 20))
            done
            return 1
          }
          node_image=$(pull_any public.ecr.aws/docker/library/node:22-alpine node:22-alpine) || { echo "nao foi possivel baixar a imagem base do node"; exit 1; }
          echo "node_image=$node_image" >> "$GITHUB_OUTPUT"
          if [ "$FRONTEND" = "true" ]; then
            nginx_image=$(pull_any public.ecr.aws/docker/library/nginx:1.27-alpine nginx:1.27-alpine) || { echo "nao foi possivel baixar a imagem base do nginx"; exit 1; }
            echo "nginx_image=$nginx_image" >> "$GITHUB_OUTPUT"
          fi

      # Sem VITE_API_URL/VITE_APP_URL e sem secrets do GitHub: os frontends chamam /api no proprio
      # dominio (o nginx repassa para o backend) e o Dockerfile ja tem esse padrao. So as imagens base.
      - name: Compose build args
        id: vite
        env:
          NODE_IMAGE: ${{ steps.base.outputs.node_image }}
          NGINX_IMAGE: ${{ steps.base.outputs.nginx_image }}
        run: |
          {
            echo 'args<<EOF'
            echo "NODE_IMAGE=$NODE_IMAGE"
            if [ -n "$NGINX_IMAGE" ]; then echo "NGINX_IMAGE=$NGINX_IMAGE"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          no-cache: true
          build-args: ${{ steps.vite.outputs.args }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
