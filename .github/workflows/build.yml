name: Build & Push Docker Images

# Publica as imagens no GHCR a cada push na master (ou disparo manual) — SEM esperar testes.
# Os testes (lint, unitarios, e2e, build dos frontends) ficam em .github/workflows/tests.yml e rodam
# em pull request ou manualmente (decisao do dono: o pipeline de deploy estava lento demais).
# Mesmo assim o build NAO e cego: o Dockerfile de cada projeto roda `npm run build` (tsc + nest build /
# vite build), entao erro de tipo ou de compilacao reprova a imagem. Cache de camadas (GitHub Actions
# cache) acelera os runs seguintes.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Um push novo cancela o build anterior ainda em andamento da mesma branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Imagens base vem do espelho publico da AWS (espelha as imagens oficiais do Docker Hub, mesmas
  # tags, sem exigir login). O Docker Hub limita pulls ANONIMOS por IP e os runners do GitHub
  # compartilham IPs: o job "Start postgres service container" ja falhou com "toomanyrequests".
  NODE_IMAGE: public.ecr.aws/docker/library/node:22-alpine
  NGINX_IMAGE: public.ecr.aws/docker/library/nginx:1.27-alpine

jobs:
  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # target: runner — o Dockerfile tem um stage "migrate" depois do "runner"; sem target
          # o Docker builda o ultimo stage (a imagem pesada de migration) como se fosse o backend.
          - name: Backend
            image: gingapp-backend
            context: ./backend
            target: runner
          # Imagem auxiliar de migration (prisma migrate deploy + bootstrap)
          - name: Migrate
            image: gingapp-migrate
            context: ./backend
            target: migrate
          - name: Painel
            image: gingapp-painel
            context: ./painel.gingapp.com.br
            target: ""
          - name: App
            image: gingapp-app
            context: ./app.gingapp.com.br
            target: ""
          - name: Admin
            image: gingapp-admin
            context: ./admin.gingapp.com.br
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # O contexto `secrets` nao existe dentro de `strategy.matrix`, so em steps: por isso os
      # build-args dos frontends (embutidos no bundle em tempo de build) sao montados aqui.
      - name: Compose build args
        id: vite
        env:
          API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api' }}
          APP_URL: ${{ secrets.VITE_APP_URL || 'http://localhost:8082' }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo 'args<<EOF'
            echo "NODE_IMAGE=$NODE_IMAGE"
            case "$IMAGE" in
              gingapp-painel)
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "VITE_API_URL=$API_URL"
                echo "VITE_APP_URL=$APP_URL"
                ;;
              gingapp-app|gingapp-admin)
                echo "NGINX_IMAGE=$NGINX_IMAGE"
                echo "VITE_API_URL=$API_URL"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Buildx e necessario para o cache do tipo "gha". O builder (driver docker-container) baixa a
      # imagem moby/buildkit; do Docker Hub ela falhava com timeout/limite de pulls anonimos no
      # runner, entao vem do espelho da AWS (mesma imagem, mesma tag).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          build-args: ${{ steps.vite.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
