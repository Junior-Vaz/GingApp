server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API no MESMO dominio do front (padrao do GestorPrint): o navegador chama /api e o nginx repassa
    # para o backend (alias "gingapp-api", unico: o nome "backend" tambem existe em OUTROS projetos do Easypanel e resolvia para o backend errado). Sem URL embutida no build, sem CORS, sem dominio
    # "api." separado. resolver + variavel: o nginx so resolve o nome na hora da requisicao (nao falha
    # ao subir se o backend ainda nao estiver de pe).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://gingapp-api:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
