# GingApp - UNICO compose do Easypanel (mesmo fluxo do GestorPrint: Actions -> GHCR -> Easypanel).
# Cole este arquivo inteiro no servico Compose do Easypanel e preencha o Environment com o
# .env.easypanel.example.
#
# Sobe: postgres + migrate (one-shot) + backend + painel + app + admin. As imagens
# (ghcr.io/junior-vaz/gingapp-*:latest) sao publicadas pelo GitHub Actions a cada push na master
# (.github/workflows/build.yml).
#
# SEM URL DE API: cada front (painel/app/admin) chama /api no proprio dominio e o nginx dele repassa
# para o servico "backend" desta rede (mesmo padrao do GestorPrint). Entao NAO existe dominio api.,
# nem VITE_*, nem CORS a configurar. No Easypanel so mapeie 3 dominios (porta 80): painel., app. e
# admin. O backend nao precisa de dominio publico. Nenhuma porta e publicada no host.
# (O painel monta o link do QR trocando painel.<dominio> por app.<dominio>.)

services:
  # Banco dentro do compose. Dados no volume gingapp_pgdata (sobrevive a redeploy; apagar o volume
  # apaga o banco). ATENCAO: POSTGRES_PASSWORD so vale na PRIMEIRA criacao do volume.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - gingapp
    environment:
      POSTGRES_USER: gingapp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (so letras e numeros, ex.: openssl rand -hex 24)}"
      POSTGRES_DB: gingapp
    volumes:
      - gingapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gingapp -d gingapp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: prisma migrate deploy + bootstrap idempotente (cria o super admin se ainda nao
  # existir) e SAI. O backend so sobe depois que este termina com sucesso.
  migrate:
    image: ghcr.io/junior-vaz/gingapp-migrate:latest
    pull_policy: always
    restart: "no"
    networks:
      - gingapp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://gingapp:${POSTGRES_PASSWORD}@postgres:5432/gingapp?schema=public"
      # EMAIL e PASSWORD juntos (ou nenhum). Senha: 12+ caracteres, 3 de 4 classes (minuscula,
      # maiuscula, digito, simbolo), sem conter o e-mail nem termos como dev@12345/senha/admin/gingapp.
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-}"

  backend:
    image: ghcr.io/junior-vaz/gingapp-backend:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://gingapp:${POSTGRES_PASSWORD}@postgres:5432/gingapp?schema=public"
      # Minimo 32 caracteres (openssl rand -hex 32); o boot falha com o valor de desenvolvimento.
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET com 32+ caracteres aleatorios - openssl rand -hex 32}"
      JWT_EXPIRES_IN: "1d"
      PORT: "3000"
      # O backend em producao exige CORS_ORIGINS nao vazio. Com /api no mesmo dominio dos fronts o
      # navegador nem usa CORS; este valor so cobre quem chamar a API de outra origem. Opcional.
      CORS_ORIGINS: "${CORS_ORIGINS:-https://painel.gingapp.com.br,https://app.gingapp.com.br,https://admin.gingapp.com.br}"
      # 2 proxies na frente do backend: proxy do Easypanel -> nginx do front -> backend (para o IP
      # real do cliente valer no limite de tentativas de login).
      TRUST_PROXY: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Painel da escola. Easypanel: dominio do painel -> porta 80.
  painel:
    image: ghcr.io/junior-vaz/gingapp-painel:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

  # App do aluno. Easypanel: dominio do app -> porta 80.
  app:
    image: ghcr.io/junior-vaz/gingapp-app:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

  # Admin da plataforma. Easypanel: dominio do admin -> porta 80.
  admin:
    image: ghcr.io/junior-vaz/gingapp-admin:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

volumes:
  gingapp_pgdata:

networks:
  gingapp:
    driver: bridge
