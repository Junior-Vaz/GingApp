# GingApp - UNICO compose do Easypanel (Actions -> Docker Hub -> Easypanel).
# Cole este arquivo inteiro no servico Compose do Easypanel e preencha o Environment com o
# .env.easypanel.example.
#
# Sobe: postgres + backend + painel + app + admin. As imagens (DOCKERHUB_USERNAME/gingapp-*:latest)
# sao publicadas pelo GitHub Actions a cada push na master (.github/workflows/build.yml).
# O servidor deste deploy nao alcanca ghcr.io/github.com; o Docker Hub (registry-1.docker.io) sim.
#
# O backend aplica as migrations e cria o super admin ao subir (como o GestorPrint) - nao ha servico
# "migrate" separado.
#
# SEM URL DE API: cada front (painel/app/admin) chama /api no proprio dominio e o nginx dele repassa
# para o servico "backend" desta rede. Entao NAO existe dominio api., nem VITE_*, nem CORS a configurar.
# No Easypanel so mapeie 3 dominios (porta 80): painel., app. e admin. O backend nao precisa de dominio
# publico. Nenhuma porta e publicada no host. (O painel monta o link do QR trocando painel.<dominio>
# por app.<dominio>.)

services:
  # Banco dentro do compose. Dados no volume gingapp_pgdata (sobrevive a redeploy; apagar o volume
  # apaga o banco). ATENCAO: POSTGRES_PASSWORD so vale na PRIMEIRA criacao do volume.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      gingapp:
        # Alias UNICO: no Easypanel os servicos que recebem dominio entram tambem na rede compartilhada e
        # nomes genericos (postgres, backend) tambem existem em OUTROS projetos - o DNS devolvia o
        # container errado (o admin chegou a falar com o backend de outro projeto).
        aliases: [gingapp-db]
    environment:
      POSTGRES_USER: gingapp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (so letras e numeros, ex.: openssl rand -hex 24)}"
      POSTGRES_DB: gingapp
    volumes:
      - gingapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gingapp -d gingapp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-backend:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      gingapp:
        aliases: [gingapp-api]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://gingapp:${POSTGRES_PASSWORD}@gingapp-db:5432/gingapp?schema=public"
      # Minimo 32 caracteres (openssl rand -hex 32); o boot falha com o valor de desenvolvimento.
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET com 32+ caracteres aleatorios - openssl rand -hex 32}"
      JWT_EXPIRES_IN: "1d"
      PORT: "3000"
      # O backend em producao exige CORS_ORIGINS nao vazio. Com /api no mesmo dominio dos fronts o
      # navegador nem usa CORS; este valor so cobre quem chamar a API de outra origem. Opcional.
      CORS_ORIGINS: "${CORS_ORIGINS:-https://painel.gingapp.com.br,https://app.gingapp.com.br,https://admin.gingapp.com.br}"
      # 2 proxies na frente do backend: proxy do Easypanel -> nginx do front -> backend (para o IP
      # real do cliente valer no limite de tentativas de login).
      TRUST_PROXY: "2"
      # Super admin inicial (criado so se o e-mail ainda nao existir; se existir, nada muda).
      # EMAIL e PASSWORD juntos (ou nenhum). Senha: 12+ caracteres, 3 de 4 classes (minuscula,
      # maiuscula, digito, simbolo), sem conter o e-mail nem termos como dev@12345/senha/admin/gingapp.
      # Senha fraca ou so um dos dois = o backend NAO sobe (veja o log).
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-}"
      # Grupo DEMO (opcional): com DEMO_GROUP=true o backend cria/completa, ao subir, o grupo de
      # demonstracao "Grupo Axe Demo" (slug demo; contas mestre@/professor1..3@/aluno1..4@demo.gingapp.com.br,
      # todas com a senha DEMO_PASSWORD). Idempotente e so toca no grupo demo. DEMO_PASSWORD e obrigatoria
      # (mesma politica do super admin: 12+ caracteres, 3 de 4 classes, sem "senha"/"admin"/"gingapp").
      # Se faltar/for fraca, o erro vai pro log e a API sobe sem o demo. Desligar (vazio/false) NAO apaga dados.
      DEMO_GROUP: "${DEMO_GROUP:-}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      # migrations + bootstrap (ts-node) rodam antes da API subir
      start_period: 120s

  # Painel da escola. Easypanel: dominio do painel -> porta 80.
  painel:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-painel:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

  # App do aluno. Easypanel: dominio do app -> porta 80.
  app:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-app:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

  # Admin da plataforma. Easypanel: dominio do admin -> porta 80.
  admin:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-admin:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

volumes:
  gingapp_pgdata:

networks:
  gingapp:
    driver: bridge
