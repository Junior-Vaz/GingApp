# GingApp - UNICO compose do Easypanel (Actions -> Docker Hub -> Easypanel).
# Cole este arquivo inteiro no servico Compose do Easypanel e preencha o Environment com o
# .env.easypanel.example.
#
# Sobe: postgres + backend + painel + app + admin. As imagens (DOCKERHUB_USERNAME/gingapp-*:latest)
# sao publicadas pelo GitHub Actions a cada push na master (.github/workflows/build.yml).
# O servidor deste deploy nao alcanca ghcr.io/github.com; o Docker Hub (registry-1.docker.io) sim.
#
# O backend aplica as migrations e cria o super admin ao subir (como o GestorPrint) - nao ha servico
# "migrate" separado.
#
# SEM URL DE API: cada front (painel/app/admin) chama /api no proprio dominio e o nginx dele repassa
# para o servico "backend" desta rede. Entao NAO existe dominio api., nem VITE_*, nem CORS a configurar.
# No Easypanel so mapeie 3 dominios (porta 80): painel., app. e admin. O backend nao precisa de dominio
# publico. Nenhuma porta e publicada no host. (O painel monta o link do QR trocando painel.<dominio>
# por app.<dominio>.)

services:
  # Banco dentro do compose. Dados no volume gingapp_pgdata (sobrevive a redeploy; apagar o volume
  # apaga o banco). ATENCAO: POSTGRES_PASSWORD so vale na PRIMEIRA criacao do volume.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      gingapp:
        # Alias UNICO: no Easypanel os servicos que recebem dominio entram tambem na rede compartilhada e
        # nomes genericos (postgres, backend) tambem existem em OUTROS projetos - o DNS devolvia o
        # container errado (o admin chegou a falar com o backend de outro projeto).
        aliases: [gingapp-db]
    environment:
      POSTGRES_USER: gingapp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (so letras e numeros, ex.: openssl rand -hex 24)}"
      POSTGRES_DB: gingapp
    volumes:
      - gingapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gingapp -d gingapp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-backend:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      gingapp:
        aliases: [gingapp-api]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://gingapp:${POSTGRES_PASSWORD}@gingapp-db:5432/gingapp?schema=public"
      # Minimo 32 caracteres (openssl rand -hex 32); o boot falha com o valor de desenvolvimento.
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET com 32+ caracteres aleatorios - openssl rand -hex 32}"
      JWT_EXPIRES_IN: "1d"
      PORT: "3000"
      # O backend em producao exige CORS_ORIGINS nao vazio. Com /api no mesmo dominio dos fronts o
      # navegador nem usa CORS; este valor so cobre quem chamar a API de outra origem. Opcional.
      CORS_ORIGINS: "${CORS_ORIGINS:-https://painel.gingapp.com.br,https://app.gingapp.com.br,https://admin.gingapp.com.br}"
      # 2 proxies na frente do backend: proxy do Easypanel -> nginx do front -> backend (para o IP
      # real do cliente valer no limite de tentativas de login).
      TRUST_PROXY: "2"
      # Super admin inicial (criado so se o e-mail ainda nao existir; se existir, nada muda).
      # EMAIL e PASSWORD juntos (ou nenhum). Senha: 12+ caracteres, 3 de 4 classes (minuscula,
      # maiuscula, digito, simbolo), sem conter o e-mail nem termos como dev@12345/senha/admin/gingapp.
      # Senha fraca ou so um dos dois = o backend NAO sobe (veja o log).
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-}"
      # Grupo DEMO (opcional): com DEMO_GROUP=true o backend cria/completa, ao subir, o grupo de
      # demonstracao "Grupo Axe Demo" (slug demo; contas mestre@/professor1..3@/aluno1..4@demo.gingapp.com.br,
      # todas com a senha DEMO_PASSWORD). Idempotente e so toca no grupo demo. DEMO_PASSWORD e obrigatoria
      # (mesma politica do super admin: 12+ caracteres, 3 de 4 classes, sem "senha"/"admin"/"gingapp").
      # Se faltar/for fraca, o erro vai pro log e a API sobe sem o demo. Desligar (vazio/false) NAO apaga dados.
      DEMO_GROUP: "${DEMO_GROUP:-}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
      # Job diario das mensalidades vencidas (03:00 America/Sao_Paulo). OVERDUE_CRON=false desliga.
      OVERDUE_CRON: "${OVERDUE_CRON:-true}"
      # Manutencao semanal: retencao da auditoria (dias; 0 = nunca apagar) e limpeza de imagens orfas (false = desliga; dry-run = so log).
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-365}"
      AUDIT_RETENTION_CRON: "${AUDIT_RETENTION_CRON:-true}"
      UPLOADS_GC: "${UPLOADS_GC:-true}"
      # Ginga Rank: recalculo noturno + fechamento mensal de temporada (false = desliga) e backfill no boot (vazio = 1x; true = sempre; false = nunca).
      RANKING_CRON: "${RANKING_CRON:-true}"
      RANKING_BACKFILL: "${RANKING_BACKFILL:-}"
      # Aulas continuas (sem data final): horizonte em dias a partir de hoje (1-365) e job diario 01:30 (false = desliga so o job).
      LESSONS_HORIZON_DAYS: "${LESSONS_HORIZON_DAYS:-60}"
      LESSONS_CRON: "${LESSONS_CRON:-true}"
      # Log estruturado de requisicao (1 linha JSON no stdout) e chave do 2FA (vazia = deriva do JWT_SECRET).
      REQUEST_LOG: "${REQUEST_LOG:-false}"
      TWO_FACTOR_KEY: "${TWO_FACTOR_KEY:-}"
      # Ficha unica (docs/FICHA_UNICA.md): chave que cifra o CPF da ficha e "pepper" do hash de busca por CPF (vazias =
      # derivam do JWT_SECRET). NUNCA troque depois de ter fichas (o pepper novo faz o CPF nao achar mais ninguem).
      # PERSON_BACKFILL: vazio = liga no boot as matriculas sem ficha; true = sempre; false = nunca.
      PERSON_DOC_KEY: "${PERSON_DOC_KEY:-}"
      PERSON_DOC_PEPPER: "${PERSON_DOC_PEPPER:-}"
      PERSON_BACKFILL: "${PERSON_BACKFILL:-}"
      # Transferencia entre grupos (ficha unica, Fase 2): job diario 04:15 que expira pedidos sem resposta e fecha as
      # contestacoes (false = desliga); prazo da pessoa decidir e janela de contestacao do grupo antigo, em dias.
      TRANSFER_CRON: "${TRANSFER_CRON:-true}"
      TRANSFER_EXPIRY_DAYS: "${TRANSFER_EXPIRY_DAYS:-14}"
      TRANSFER_CONTEST_DAYS: "${TRANSFER_CONTEST_DAYS:-7}"
      # Cargos (ficha unica, Fase 3): no boot cria o cargo + a matricula de aluno (isStaff) da equipe que ainda nao tem
      # (vazio = so quando ha equipe sem matricula; true = sempre; false = nunca).
      ROLES_BACKFILL: "${ROLES_BACKFILL:-}"
      # TERMS_ENFORCEMENT=true: o servidor tambem barra (403) quem nao aceitou a versao vigente dos Termos/Politica.
      # Padrao false: so o frontend exige o aceite.
      TERMS_ENFORCEMENT: "${TERMS_ENFORCEMENT:-false}"
      # E-mail transacional (OPCIONAL): "Esqueci minha senha" e convite de aluno/responsavel por e-mail. Sem SMTP_HOST
      # (e remetente) o recurso fica DESLIGADO e nada muda (botao "Esqueci a senha" nao aparece; GET /auth/capabilities
      # devolve passwordResetByEmail=false). SMTP_SECURE=true = TLS direto (porta 465); vazio/false = STARTTLS (587).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      # Web Push (OPCIONAL): avisos no celular do aluno/responsavel (PWA). Sem as 3 variaveis o push fica DESLIGADO e nada
      # muda (GET /push/config devolve enabled=false e o app nao mostra o botao). Gere as chaves UMA vez com
      # `npx web-push generate-vapid-keys` e NAO as troque depois (trocar invalida todas as inscricoes dos aparelhos).
      # VAPID_SUBJECT = mailto:contato@seudominio.com.br (ou https://...).
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      # Firebase Cloud Messaging (FCM, OPCIONAL): transporte PRINCIPAL dos avisos push; funciona com o app aberto (toast +
      # sino na hora) e fechado. Precisa das DUAS metades: conta de servico (envio) + config do app Web (navegador). Se
      # faltar qualquer campo o FCM fica desligado e o Web Push VAPID acima (se houver) assume. Nada vai no build do app:
      # a config web e' servida em runtime por GET /api/push/config. Passo a passo: docs/EASYPANEL.md, secao 13b.
      #  - Conta de servico: FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY (cole com \n escapado ou
      #    com quebras reais), OU FIREBASE_SERVICE_ACCOUNT_JSON (o .json inteiro em base64) no lugar dos tres.
      #  - App Web: FIREBASE_WEB_API_KEY, FIREBASE_WEB_AUTH_DOMAIN (opcional), FIREBASE_WEB_MESSAGING_SENDER_ID,
      #    FIREBASE_WEB_APP_ID, FIREBASE_WEB_VAPID_KEY (chave do par Web Push em Cloud Messaging), FIREBASE_WEB_STORAGE_BUCKET (opcional).
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL:-}"
      FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY:-}"
      FIREBASE_SERVICE_ACCOUNT_JSON: "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
      FIREBASE_WEB_API_KEY: "${FIREBASE_WEB_API_KEY:-}"
      FIREBASE_WEB_AUTH_DOMAIN: "${FIREBASE_WEB_AUTH_DOMAIN:-}"
      FIREBASE_WEB_STORAGE_BUCKET: "${FIREBASE_WEB_STORAGE_BUCKET:-}"
      FIREBASE_WEB_MESSAGING_SENDER_ID: "${FIREBASE_WEB_MESSAGING_SENDER_ID:-}"
      FIREBASE_WEB_APP_ID: "${FIREBASE_WEB_APP_ID:-}"
      FIREBASE_WEB_VAPID_KEY: "${FIREBASE_WEB_VAPID_KEY:-}"
      # Mapa da comunidade (OPCIONAL, Google Maps): sem GOOGLE_MAPS_API_KEY o app mostra uma lista no lugar do mapa
      # (GET /api/map/config devolve enabled=false). API_KEY = chave de NAVEGADOR (restrita por referrer, publica por
      # natureza); SERVER_KEY = chave de SERVIDOR so para geocodificar enderecos (restrita por IP/API; NUNCA vai ao
      # navegador); MAP_ID = ID do mapa estilizado (opcional). Passo a passo: docs/EASYPANEL.md, secao 14.
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      GOOGLE_MAPS_SERVER_KEY: "${GOOGLE_MAPS_SERVER_KEY:-}"
      GOOGLE_MAPS_MAP_ID: "${GOOGLE_MAPS_MAP_ID:-}"
      # Origens publicas dos frontends, usadas nos LINKS dos e-mails (/redefinir-senha?token=...) e no QR do certificado PDF.
      APP_URL: "${APP_URL:-https://app.gingapp.com.br}"
      PAINEL_URL: "${PAINEL_URL:-https://painel.gingapp.com.br}"
      ADMIN_URL: "${ADMIN_URL:-https://admin.gingapp.com.br}"
      # Imagens enviadas (POST /uploads): gravadas em disco, sem servico externo (S3/R2). UPLOADS_DIR e o diretorio
      # dentro do container (volume gingapp_uploads, sobrevive a redeploy); UPLOAD_ORG_QUOTA_MB = cota de imagens
      # por grupo (padrao 1024; 0 = sem limite). Limite por arquivo: 5 MB (fixo no codigo).
      UPLOADS_DIR: "/app/uploads"
      UPLOAD_ORG_QUOTA_MB: "${UPLOAD_ORG_QUOTA_MB:-1024}"
    volumes:
      - gingapp_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      # migrations + bootstrap (ts-node) rodam antes da API subir
      start_period: 120s

  # Backup diario do banco (E11). Mesma imagem do postgres (sem conta nova): roda pg_dump -Fc contra o
  # gingapp-db a cada BACKUP_INTERVAL_HOURS (padrao 24h; o 1o dump sai logo que o servico sobe) e grava em
  # /backups (volume gingapp_backups) como gingapp-AAAAMMDDTHHMMSSZ.dump. Retencao: apaga os .dump com mais de
  # BACKUP_KEEP_DAYS dias (padrao 14). So apaga um dump antigo DEPOIS de gravar o novo com sucesso (um dump que
  # falha nunca remove os anteriores). BACKUP_ENABLED=false deixa o servico parado (sem dump, sem erro).
  # O volume fica no MESMO servidor do banco: copie /backups para fora periodicamente (docs/EASYPANEL.md, secao 7).
  # Restaurar: docs/EASYPANEL.md, secao 7 (script ops/backup/restore.sh).
  # ($$ = o compose nao interpola; o sh do container e quem expande.)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      gingapp:
        aliases: [gingapp-backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: gingapp-db
      PGUSER: gingapp
      PGDATABASE: gingapp
      PGPASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}"
      BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
    volumes:
      - gingapp_backups:/backups
      # Imagens enviadas (somente leitura): entram no backup como gingapp-uploads-*.tgz junto de cada dump.
      - gingapp_uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${BACKUP_ENABLED}" = "false" ]; then
          echo "[backup] desligado (BACKUP_ENABLED=false)"
          while true; do sleep 3600; done
        fi
        case "$${BACKUP_KEEP_DAYS}" in ''|*[!0-9]*) echo "[backup] BACKUP_KEEP_DAYS invalido, usando 14"; BACKUP_KEEP_DAYS=14;; esac
        case "$${BACKUP_INTERVAL_HOURS}" in ''|*[!0-9]*|0) echo "[backup] BACKUP_INTERVAL_HOURS invalido, usando 24"; BACKUP_INTERVAL_HOURS=24;; esac
        echo "[backup] ligado: a cada $${BACKUP_INTERVAL_HOURS}h, retencao $${BACKUP_KEEP_DAYS} dia(s), destino /backups"
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          file="/backups/gingapp-$${stamp}.dump"
          if pg_dump -Fc -f "$${file}.tmp" && [ -s "$${file}.tmp" ]; then
            mv "$${file}.tmp" "$${file}"
            echo "[backup] ok: $${file} ($$(wc -c < "$${file}") bytes)"
            find /backups -maxdepth 1 -name 'gingapp-*.dump' -mtime +"$${BACKUP_KEEP_DAYS}" -print -delete
            # imagens enviadas (POST /uploads): tar.gz do volume gingapp_uploads, mesma retencao; falha aqui so avisa
            upl="/backups/gingapp-uploads-$${stamp}.tgz"
            if tar czf "$${upl}.tmp" -C /uploads . 2>/dev/null && [ -s "$${upl}.tmp" ]; then
              mv "$${upl}.tmp" "$${upl}"
              echo "[backup] ok: $${upl} ($$(wc -c < "$${upl}") bytes)"
              find /backups -maxdepth 1 -name 'gingapp-uploads-*.tgz' -mtime +"$${BACKUP_KEEP_DAYS}" -print -delete
            else
              echo "[backup] AVISO: backup das imagens falhou em $${stamp} (o dump do banco esta ok)"
              rm -f "$${upl}.tmp"
            fi
          else
            echo "[backup] FALHOU em $${stamp}; dumps anteriores mantidos"
            rm -f "$${file}.tmp"
          fi
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done

  # Painel da escola. Easypanel: dominio do painel -> porta 80.
  painel:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-painel:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

  # App do aluno. Easypanel: dominio do app -> porta 80.
  app:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-app:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

  # Admin da plataforma. Easypanel: dominio do admin -> porta 80.
  admin:
    image: ${DOCKERHUB_USERNAME:?defina DOCKERHUB_USERNAME}/gingapp-admin:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - gingapp

volumes:
  gingapp_pgdata:
  gingapp_backups:
  gingapp_uploads:

networks:
  gingapp:
    driver: bridge
