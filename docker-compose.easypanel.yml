# GingApp - UNICO compose do Easypanel. Cole este arquivo inteiro no servico Compose do Easypanel.
#
# Sobe: postgres + migrate (one-shot) + backend + painel + app + admin.
# As imagens sao CONSTRUIDAS no proprio servidor, buscando o codigo direto do GitHub (contexto
# git remoto "https://github.com/...#master:pasta"): nao precisa de registro de imagens (GHCR/Docker
# Hub), de CI, de PAT de pacote, nem de enviar as pastas do repo para o Easypanel. So o Docker Hub
# (node, nginx, postgres) e o registry npm precisam estar acessiveis.
#
# VARIAVEIS: veja o .env.easypanel.example (ou cole no Environment do Easypanel):
#   POSTGRES_PASSWORD, JWT_SECRET, CORS_ORIGINS, SUPER_ADMIN_EMAIL, SUPER_ADMIN_PASSWORD,
#   VITE_API_URL, VITE_APP_URL e, se o repositorio for PRIVADO, GIT_TOKEN.
#
# REPOSITORIO PRIVADO: crie um token do GitHub so de leitura (Settings > Developer settings >
# Fine-grained tokens > acesso ao repo GingApp, permissao "Contents: Read-only") e ponha em GIT_TOKEN.
# Repositorio PUBLICO: deixe GIT_TOKEN vazio.
#
# Primeiro deploy: ~5-10 min (compila o backend e os 3 frontends no servidor; recomendado >= 4 GB de
# RAM livre ou swap). Cada Deploy rebuilda a partir do ultimo commit da master.
#
# NENHUMA porta e publicada no host: no Easypanel mapeie cada dominio para a porta interna do
# servico (backend 3000; painel/app/admin 80). Rede interna "gingapp"; use o nome do servico (DNS).

services:
  # Banco. Dados no volume nomeado gingapp_pgdata (sobrevive a redeploy; apagar o volume apaga o
  # banco). ATENCAO: POSTGRES_PASSWORD so vale na PRIMEIRA criacao do volume.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - gingapp
    environment:
      POSTGRES_USER: gingapp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (so letras e numeros, ex.: openssl rand -hex 24)}"
      POSTGRES_DB: gingapp
    volumes:
      - gingapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gingapp -d gingapp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: prisma migrate deploy + bootstrap idempotente (cria o super admin se ainda nao
  # existir) e SAI. O backend so sobe depois que este termina com sucesso.
  migrate:
    build:
      context: https://${GIT_TOKEN:+x-access-token:${GIT_TOKEN}@}github.com/Junior-Vaz/GingApp.git#master:backend
      target: migrate
    image: gingapp-migrate:local
    restart: "no"
    networks:
      - gingapp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://gingapp:${POSTGRES_PASSWORD}@postgres:5432/gingapp?schema=public"
      # EMAIL e PASSWORD juntos (ou nenhum). Senha: 12+ caracteres, 3 de 4 classes (minuscula,
      # maiuscula, digito, simbolo), sem conter o e-mail nem termos como dev@12345/senha/admin/gingapp.
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      SUPER_ADMIN_NAME: "${SUPER_ADMIN_NAME:-}"

  backend:
    build:
      context: https://${GIT_TOKEN:+x-access-token:${GIT_TOKEN}@}github.com/Junior-Vaz/GingApp.git#master:backend
      target: runner
    image: gingapp-backend:local
    restart: unless-stopped
    networks:
      - gingapp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://gingapp:${POSTGRES_PASSWORD}@postgres:5432/gingapp?schema=public"
      # Minimo 32 caracteres (openssl rand -hex 32); o boot falha com o valor de desenvolvimento.
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET com 32+ caracteres aleatorios - openssl rand -hex 32}"
      JWT_EXPIRES_IN: "1d"
      PORT: "3000"
      # Origens https dos 3 frontends, separadas por virgula, sem barra final e sem "*".
      CORS_ORIGINS: "${CORS_ORIGINS:?defina CORS_ORIGINS com as origens https dos 3 frontends, separadas por virgula}"
      # Atras do proxy do Easypanel: 1 (sem isso o backend ve o IP do proxy).
      TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Painel da escola. Easypanel: dominio do painel -> porta 80.
  painel:
    build:
      context: https://${GIT_TOKEN:+x-access-token:${GIT_TOKEN}@}github.com/Junior-Vaz/GingApp.git#master:painel.gingapp.com.br
      args:
        VITE_API_URL: "${VITE_API_URL:?defina VITE_API_URL, ex.: https://api.seudominio.com.br/api}"
        VITE_APP_URL: "${VITE_APP_URL:?defina VITE_APP_URL, ex.: https://app.seudominio.com.br}"
    image: gingapp-painel:local
    restart: unless-stopped
    networks:
      - gingapp

  # App do aluno. Easypanel: dominio do app -> porta 80.
  app:
    build:
      context: https://${GIT_TOKEN:+x-access-token:${GIT_TOKEN}@}github.com/Junior-Vaz/GingApp.git#master:app.gingapp.com.br
      args:
        VITE_API_URL: "${VITE_API_URL:?defina VITE_API_URL, ex.: https://api.seudominio.com.br/api}"
    image: gingapp-app:local
    restart: unless-stopped
    networks:
      - gingapp

  # Admin da plataforma. Easypanel: dominio do admin -> porta 80.
  admin:
    build:
      context: https://${GIT_TOKEN:+x-access-token:${GIT_TOKEN}@}github.com/Junior-Vaz/GingApp.git#master:admin.gingapp.com.br
      args:
        VITE_API_URL: "${VITE_API_URL:?defina VITE_API_URL, ex.: https://api.seudominio.com.br/api}"
    image: gingapp-admin:local
    restart: unless-stopped
    networks:
      - gingapp

volumes:
  gingapp_pgdata:

networks:
  gingapp:
    driver: bridge
