# Formularios de inscricao (/i/<slug>): robos de PRE-VISUALIZACAO de link (WhatsApp, Facebook/Instagram, Telegram...)
# nao executam a SPA, entao recebem do backend um HTML com as tags Open Graph (GET /api/public/forms/<slug>/share).
# Pessoas recebem a SPA normal. `?src=share` (o redirecionamento do proprio HTML de share) nunca e tratado como robo,
# para um navegador com user-agent parecido com robo nao entrar em loop. (Este arquivo vai em conf.d = contexto http.)
map "$http_user_agent|$arg_src" $form_share_bot {
    default 0;
    "~\|share$" 0;
    "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot|Pinterestbot|SkypeUriPreview|Google-InspectionTool|bingbot|Applebot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Link publico do formulario de inscricao. Robo de preview -> HTML com Open Graph do backend; pessoa -> SPA.
    location ~ ^/i/([A-Za-z0-9-]+)/?$ {
        set $form_slug $1;
        if ($form_share_bot) {
            rewrite ^ /__form_share/$form_slug last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # So alcancavel pelo rewrite acima (internal): repassa ao backend pelo mesmo alias/resolver do /api/.
    location ~ ^/__form_share/(?<share_slug>[A-Za-z0-9-]+)$ {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://gingapp-api:3000;
        proxy_pass $backend_upstream/api/public/forms/$share_slug/share;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
    }

    # API no MESMO dominio do front (padrao do GestorPrint): o navegador chama /api e o nginx repassa
    # para o backend (alias "gingapp-api", unico: o nome "backend" tambem existe em OUTROS projetos do Easypanel e resolvia para o backend errado). Sem URL embutida no build, sem CORS, sem dominio
    # "api." separado. resolver + variavel: o nginx so resolve o nome na hora da requisicao (nao falha
    # ao subir se o backend ainda nao estiver de pe).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://gingapp-api:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # SPA (TanStack Router, history mode) - toda rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Service worker e manifest nunca ficam em cache (autoUpdate propaga rápido).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Idem para o handler de Web Push (importado pelo sw.js) e o service worker do FCM: sem cache para propagar rapido.
    location ~ ^/(sw-push|firebase-messaging-sw)\.js$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
