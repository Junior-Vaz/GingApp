server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API no MESMO dominio do front (padrao do GestorPrint): o navegador chama /api e o nginx repassa
    # para o servico "backend" da rede do compose. Sem URL embutida no build, sem CORS, sem dominio
    # "api." separado. resolver + variavel: o nginx so resolve o nome na hora da requisicao (nao falha
    # ao subir se o backend ainda nao estiver de pe).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # SPA (TanStack Router, history mode) - toda rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Service worker e manifest nunca ficam em cache (autoUpdate propaga rápido).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
